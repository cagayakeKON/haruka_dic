<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haruka · 选择原型</title>
  <link rel="stylesheet" href="styles.css?v=0.6">
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f7f9fd; }
    main { width: min(100%, 720px); }
    h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 28px; }
    .entries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .entries a { display: flex; flex-direction: column; gap: 10px; min-height: 160px; padding: 26px; border: 1px solid #dce6f7; border-radius: 18px; background: #fff; }
    .entries a:hover, .entries a:focus-visible { border-color: var(--primary); box-shadow: 0 10px 30px #265ad615; }
    .entries strong { font-size: 22px; }
    .entries span { color: var(--muted); font-size: 13px; }
    @media (max-width: 520px) { .entries { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Haruka 原型</h1>
    <p>分别打开手机端与电脑端页面。</p>
    <div class="entries">
      <a href="phone.html#collections"><strong>手机端 →</strong><span>触控导航、分层页面与底部操作</span></a>
      <a href="desktop.html#library"><strong>电脑端 →</strong><span>侧边导航、宽屏书库与阅读布局</span></a>
    </div>
  </main>
</body>
</html>
