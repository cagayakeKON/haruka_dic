name: Selected platform checks

# Explicit selection avoids treating every small change as a full milestone run.
# Runtime acceptance and full milestone report aggregation remain separate requirements.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Directly affected implementation to validate
        required: true
        type: choice
        options: [backend, web, windows, android]

permissions:
  contents: read

jobs:
  backend:
    if: inputs.scope == 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.6'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.17'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: python scripts/dev.py bootstrap --scope backend
      - run: python scripts/dev.py check --stage backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-local-checks
          path: artifacts/dev/**
          if-no-files-found: error
          retention-days: 7

  frontend:
    if: inputs.scope != 'backend'
    runs-on: ${{ inputs.scope == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      HARUKA_PLATFORM: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: inputs.scope == 'android'
        with:
          distribution: temurin
          java-version: '21.0.10'
      - name: Check the exact Flutter revision
        shell: bash
        run: |
          flutter --version --machine > flutter-version.json
          python -c "import json; t=json.load(open('tools/toolchain.json')); f=json.load(open('flutter-version.json')); assert f['frameworkRevision']==t['flutter']['revision'] and f['dartSdkVersion']==t['flutter']['dart']"
      - working-directory: frontend
        run: flutter pub get --enforce-lockfile
      - working-directory: frontend
        run: flutter analyze --fatal-infos --fatal-warnings
      - working-directory: frontend
        run: flutter test test --reporter expanded
      - name: Build selected shell
        working-directory: frontend
        shell: bash
        run: |
          case "$HARUKA_PLATFORM" in
            web) flutter build web --dart-define=HARUKA_ENV=dev ;;
            windows) flutter build windows --debug --dart-define=HARUKA_ENV=dev ;;
            android) flutter build apk --debug --flavor dev --dart-define=HARUKA_ENV=dev --dart-define=HARUKA_API_BASE_URL=http://10.0.2.2:8000 ;;
            *) exit 2 ;;
          esac
