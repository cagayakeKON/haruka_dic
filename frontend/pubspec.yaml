name: haruka
description: Haruka language-learning application shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.3 <4.0.0'
  flutter: '>=3.47.3'

dependencies:
  characters: 1.4.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  web: 1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.1
  flutter_riverpod: 3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
