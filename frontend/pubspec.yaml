name: haruka
description: Haruka language-learning application shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.3 <4.0.0'
  flutter: '>=3.47.3'

dependencies:
  characters: 1.4.1
  crypto: 3.0.7
  csv: 8.0.0
  dio: 5.11.1
  drift: 2.35.0
  file_selector: 1.1.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  path: 1.9.1
  sqlite3: 3.6.0
  timezone: 0.11.1
  share_plus: 13.3.0
  web: 1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.1
  flutter_riverpod: 3.4.3
  image_picker: 1.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.1

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.ttf
