name: Quality gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quality.yml'
      - 'scripts/quality/**'
      - 'scripts/tests/test_quality*.py'
      - 'testdata/**'
      - 'tools/ci/**'
      - 'tools/codegen/manifest.json'
      - 'tools/toolchain.json'
      - 'backend/app/**'
      - 'frontend/lib/**'

permissions:
  contents: read

jobs:
  quality:
    name: Quality checker / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.6'
      - name: Required-case, coverage-checker and immutable fixture tests
        env:
          HARUKA_CHECKOUT_SHA: ${{ github.sha }}
        shell: bash
        run: python -m tools.ci.quality --commit "$HARUKA_CHECKOUT_SHA" --output artifacts/quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-${{ matrix.os }}
          path: artifacts/quality/*.json
          if-no-files-found: error
          retention-days: 7

  pytest-adapter:
    name: Pytest collector / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.6'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Real pytest result and collection failures
        env:
          HARUKA_CHECKOUT_SHA: ${{ github.sha }}
        shell: bash
        run: uv run --project backend --locked --only-group test python -m tools.ci.quality --scope pytest-adapter --commit "$HARUKA_CHECKOUT_SHA" --output artifacts/pytest-adapter
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pytest-adapter-${{ matrix.os }}
          path: artifacts/pytest-adapter/*.json
          if-no-files-found: error
          retention-days: 7
